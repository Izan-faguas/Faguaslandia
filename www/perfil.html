<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>Faguáslandia — Perfil</title>
</head>

<body>

<header>
  <nav class="menu"></nav>
  <script type="module">
    import { getSessionUser, logout } from "./session.js";
    const menu = document.querySelector(".menu");
    const u = await getSessionUser();
    if (u) {
      menu.innerHTML = `
        <a href="index.html">Biblioteca</a>
        <a href="tienda.html">Tienda</a>
        <a href="perfil.html">Perfil</a>
        <a href="#" id="logoutBtn">Cerrar sesión</a>`;
      document.getElementById("logoutBtn").onclick = logout;
    } else {
      menu.innerHTML = `
        <a href="index.html">Biblioteca</a>
        <a href="tienda.html">Tienda</a>
        <a href="registro.html">Registro</a>
        <a href="login.html">Iniciar sesión</a>`;
    }
  </script>
</header>

<main>
  <div class="perfil">

    <div class="perfil-banner"><div class="perfil-overlay"></div></div>

    <div class="perfil-header">
      <img id="fotoPerfil" class="avatar">
      <div class="perfil-nombre">
        <h1 id="nombreUsuario">Cargando...</h1>
        <span class="nivel">Nivel 7</span>
      </div>
    </div>

    <div class="perfil-body">

      <div class="perfil-info">
        <p><strong>Correo:</strong> <span id="emailUsuario"></span></p>
        <p><strong>Código amigo:</strong>
          <span id="nombreAmigo"></span>#<span id="idAmigo"></span>
        </p>
        <button id="editarPerfilBtn" class="btnEditar">Editar perfil</button>
      </div>

      <div class="perfil-stats">
        <div class="stat-card">
          <h3>🎮 Juegos</h3>
          <p id="statJuegos">—</p>
        </div>
        <div class="stat-card">
          <h3>⏱️ Horas</h3>
          <p id="statHoras">—</p>
        </div>
        <div class="stat-card">
          <h3>🏆 Logros</h3>
          <p id="statLogros">—</p>
        </div>
      </div>

    </div>

    <!-- ── SECCIÓN AMIGOS ── -->
    <div class="perfil-amigos">

      <h2>👥 Amigos</h2>

      <div class="agregar-amigo">
        <input type="text" id="codigoAmigo" placeholder="Buscar por Nombre#id">
        <button id="btnAgregarAmigo">Enviar solicitud</button>
      </div>

      <h3>Solicitudes pendientes</h3>
      <div id="listaSolicitudes"><p class="empty-state">Sin solicitudes</p></div>

      <h3>Lista de amigos</h3>
      <div id="listaAmigos"><p class="empty-state">Sin amigos aún</p></div>

    </div>

  </div>
</main>

<!-- ── MODAL EDITAR PERFIL ── -->
<div id="editarPerfilModal">
  <div class="modal-content">
    <h2>Editar Perfil</h2>
    <label>Nombre</label>
    <input type="text" id="editarNombre">
    <label>Correo</label>
    <input type="text" id="editarCorreo">
    <label>Foto</label>
    <input type="file" id="editarFoto" accept="image/*">
    <button id="guardarCambios">Guardar</button>
    <button id="cerrarModal">Cancelar</button>
  </div>
</div>



<script type="module">
import CONFIG from "./config.js";

let usuario = null;

// ─────────────────────────────────────────
// CARGAR PERFIL
// ─────────────────────────────────────────
async function cargarPerfil() {
  try {
    const res = await fetch(`${CONFIG.API_BASE_URL}/auth/me?t=${Date.now()}`, {
      method: "GET",
      credentials: "include",
      cache: "no-store"
    });
    if (res.status === 401) { window.location.href = "login.html"; return; }

    usuario = await res.json();

    document.getElementById("nombreUsuario").textContent = usuario.nombre + "#" + usuario.id;
    document.getElementById("emailUsuario").textContent  = usuario.email;
    document.getElementById("nombreAmigo").textContent   = usuario.nombre;
    document.getElementById("idAmigo").textContent       = usuario.id;

    const foto = document.getElementById("fotoPerfil");
    if (usuario.foto && usuario.foto !== "default_avatar.png") {
      foto.src = `${CONFIG.API_BASE_URL}/uploads/img/${usuario.foto}?t=${Date.now()}`;
    } else {
      foto.src = "img/default.png";
    }
  } catch (e) {
    console.error(e);
    window.location.href = "login.html";
  }
}

// ─────────────────────────────────────────
// STATS REALES
// ─────────────────────────────────────────
async function cargarStats() {
  try {
    const res = await fetch(`${CONFIG.API_BASE_URL}/usuarios/${usuario.id}/stats`, { credentials: "include" });
    if (!res.ok) return;
    const stats = await res.json();
    document.getElementById("statJuegos").textContent = stats.juegos;
    document.getElementById("statHoras").textContent  = stats.horas + "h";
    document.getElementById("statLogros").textContent = stats.logros;
  } catch (e) {
    console.error("Error cargando stats:", e);
  }
}

// ─────────────────────────────────────────
// SOLICITUDES
// ─────────────────────────────────────────
async function cargarSolicitudes() {
  const res = await fetch(`${CONFIG.API_BASE_URL}/usuarios/${usuario.id}/solicitudes`, { credentials: "include" });
  const solicitudes = await res.json();
  const cont = document.getElementById("listaSolicitudes");

  if (!solicitudes.length) {
    cont.innerHTML = `<p class="empty-state">Sin solicitudes pendientes</p>`;
    return;
  }

  cont.innerHTML = "";
  solicitudes.forEach(sol => {
    const div = document.createElement("div");
    div.className = "solicitud-item";
    div.innerHTML = `
      <span>${sol.usuario1.nombre}#${sol.usuario1.id}</span>
      <div style="display:flex;gap:8px">
        <button class="btn-chat" onclick="aceptarSolicitud(${sol.id})">Aceptar</button>
        <button class="btn-rechazar" onclick="rechazarSolicitud(${sol.id})">Rechazar</button>
      </div>`;
    cont.appendChild(div);
  });
}

// ─────────────────────────────────────────
// AMIGOS
// ─────────────────────────────────────────
async function cargarAmigos() {
  const res = await fetch(`${CONFIG.API_BASE_URL}/usuarios/${usuario.id}/amigos`, { credentials: "include" });
  const amigos = await res.json();
  const cont = document.getElementById("listaAmigos");

  const aceptados = amigos.filter(a => a.estado === "aceptado");

  if (!aceptados.length) {
    cont.innerHTML = `<p class="empty-state">Sin amigos aún. ¡Envía una solicitud!</p>`;
    return;
  }

  cont.innerHTML = "";
  for (const amigo of aceptados) {
    const esYo   = amigo.usuario1.id === usuario.id;
    const otro   = esYo ? amigo.usuario2 : amigo.usuario1;
    const estado = (otro.estado || "offline").toLowerCase();



    const div = document.createElement("div");
    div.className = "amigo-item";
    div.id = `amigo-${otro.id}`;
    div.dataset.amigoId     = otro.id;
    div.dataset.amigoNombre = otro.nombre;
    div.dataset.relacionId  = amigo.id;
    div.innerHTML = `
      <div style="display:flex;align-items:center">
        <span class="estado-badge ${estado}"></span>
        <span>${otro.nombre}</span>
      </div>
      <div class="amigo-actions">
        <button class="btn-eliminar">Eliminar</button>
      </div>`;
    div.querySelector(".btn-eliminar").onclick = () => eliminarAmigo(amigo.id, otro.id);
    cont.appendChild(div);
  }
}

// ─────────────────────────────────────────
// ACCIONES SOLICITUDES
// ─────────────────────────────────────────
window.aceptarSolicitud = async function(id) {
  await fetch(`${CONFIG.API_BASE_URL}/usuarios/solicitud/${id}/aceptar`, { method: "PUT", credentials: "include" });
  await cargarSolicitudes();
  await cargarAmigos();
};

window.rechazarSolicitud = async function(id) {
  await fetch(`${CONFIG.API_BASE_URL}/usuarios/solicitud/${id}/rechazar`, { method: "DELETE", credentials: "include" });
  await cargarSolicitudes();
};

// ─────────────────────────────────────────
// ELIMINAR AMIGO
// ─────────────────────────────────────────
window.eliminarAmigo = async function(relacionId, amigoUserId) {
  if (!confirm("¿Seguro que quieres eliminar a este amigo?")) return;
  await fetch(
    `${CONFIG.API_BASE_URL}/usuarios/${usuario.id}/amigos/${amigoUserId}`,
    { method: "DELETE", credentials: "include" }
  );
  await cargarAmigos();
};

// ─────────────────────────────────────────
// ENVIAR SOLICITUD POR CÓDIGO
// ─────────────────────────────────────────
document.getElementById("btnAgregarAmigo").onclick = async () => {
  const codigo = document.getElementById("codigoAmigo").value.trim();
  if (!codigo.includes("#")) {
    alert("Formato inválido. Usa Nombre#id");
    return;
  }
  const id2 = parseInt(codigo.split("#")[1]);
  if (isNaN(id2)) { alert("ID inválido"); return; }
  if (id2 === usuario.id) { alert("No puedes agregarte a ti mismo"); return; }

  try {
    const res = await fetch(
      `${CONFIG.API_BASE_URL}/usuarios/${usuario.id}/agregar/${id2}`,
      { method: "POST", credentials: "include" }
    );
    if (res.ok) {
      alert("Solicitud enviada ✓");
      document.getElementById("codigoAmigo").value = "";
    } else {
      const msg = await res.text();
      alert("Error: " + msg);
    }
  } catch(e) {
    alert("Error enviando solicitud");
  }
};

// ─────────────────────────────────────────
// EDITAR PERFIL
// ─────────────────────────────────────────
const modal = document.getElementById("editarPerfilModal");

document.getElementById("editarPerfilBtn").onclick = () => {
  document.getElementById("editarNombre").value = usuario.nombre;
  document.getElementById("editarCorreo").value = usuario.email;
  modal.style.display = "flex";
};

document.getElementById("cerrarModal").onclick = () => {
  modal.style.display = "none";
};

document.getElementById("guardarCambios").onclick = async () => {
  const nombre = document.getElementById("editarNombre").value.trim();
  const correo = document.getElementById("editarCorreo").value.trim();
  const foto   = document.getElementById("editarFoto").files[0];

  if (!nombre || !correo) { alert("Nombre y correo no pueden estar vacíos"); return; }
  if (foto && !foto.type.startsWith("image/")) { alert("Solo puedes subir imágenes"); return; }

  const formData = new FormData();
  formData.append("nombre", nombre);
  formData.append("email", correo);
  if (foto) formData.append("foto", foto);

  try {
    const res = await fetch(
      `${CONFIG.API_BASE_URL}/usuarios/actualizar/${usuario.id}`,
      { method: "PUT", body: formData, credentials: "include" }
    );
    if (!res.ok) throw new Error("Error actualizando perfil");
    alert("Perfil actualizado ✓");
    modal.style.display = "none";
    document.getElementById("editarFoto").value = "";
    await cargarPerfil();
    await cargarStats();
  } catch(e) {
    console.error(e);
    alert("Error al actualizar perfil");
  }
};

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
await cargarPerfil();
await cargarStats();
await cargarSolicitudes();
await cargarAmigos();


</script>

</body>
</html>
