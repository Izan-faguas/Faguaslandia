<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faguáslandia</title>
<link rel="stylesheet" href="index.css">
</head>

<body>

<nav class="menu"></nav>
<script type="module">
import { getSessionUser, logout } from "./session.js";
const menu = document.querySelector(".menu");
const u = await getSessionUser();
if (u) {
  menu.innerHTML = `
    <a href="index.html">Biblioteca</a>
    <a href="tienda.html">Tienda</a>
    <a href="perfil.html">Perfil</a>
    <a href="#" id="logoutBtn">Cerrar sesión</a>`;
  document.getElementById("logoutBtn").onclick = logout;
} else {
  menu.innerHTML = `
    <a href="index.html">Biblioteca</a>
    <a href="tienda.html">Tienda</a>
    <a href="registro.html">Registro</a>
    <a href="login.html">Iniciar sesión</a>`;
}
</script>
</header>

<main>
<div class="catalogo">

  <!-- 📚 LISTA -->
  <div class="juego">
    <h1>🎮 Biblioteca</h1>
    <div class="juegos" id="juegosGrid"></div>
  </div>

  <!-- 🎮 DETALLE -->
  <div class="detalle-juego" id="detalleJuego">
    <h2 style="padding:30px;color:var(--text-muted)">Selecciona un juego</h2>
  </div>

  <!-- 👥 AMIGOS -->
  <div class="amigos-panel" id="amigosPanel">
    <h2>👥 Amigos</h2>
    <div id="listaAmigosIndex"><p class="amigos-vacio">Cargando...</p></div>
  </div>

</div>
</main>

<!-- CHAT FLOTANTE -->
<div id="chatFloat">
  <div class="chat-float-header" id="chatFloatHeader">
    <span id="chatFloatNombre">Chat</span>
    <button id="cerrarChatFloat">✕</button>
  </div>
  <div class="chat-float-messages" id="chatFloatMessages"></div>
  <div class="chat-float-input">
    <input type="text" id="chatFloatInput" placeholder="Escribe un mensaje..." maxlength="500">
    <button id="btnEnviarFloat">↑</button>
  </div>
</div>

<script type="module">
import CONFIG from "./config.js";
import { getSessionUser } from "./session.js";

let usuario = null;
let chatAmigoId = null;
let chatPollInterval = null;
let amigosPollInterval = null;

// ─────────────────────────────────────────
// BIBLIOTECA
// ─────────────────────────────────────────
async function actualizarBiblioteca() {
  const juegosGrid = document.getElementById("juegosGrid");
  const detalle    = document.getElementById("detalleJuego");

  try {
    usuario = await getSessionUser();
    if (!usuario) { window.location.href = "tienda.html"; return; }

    const res   = await fetch(`${CONFIG.API_BASE_URL}/compras/usuario/${usuario.id}`, { credentials: "include" });
    const juegos = await res.json();

    juegosGrid.innerHTML = "";

    juegos.forEach((juego, i) => {
      const img = document.createElement("img");
      img.src = `${CONFIG.API_BASE_URL}/uploads/${juego.imagen_url}` || "default.png";
      img.classList.add("game-cover");
      img.addEventListener("click", () => { mostrarJuego(juego, detalle); seleccionar(img); });
      juegosGrid.appendChild(img);
      if (i === 0) { mostrarJuego(juego, detalle); seleccionar(img); }
    });

    if (!juegos.length) {
      juegosGrid.innerHTML = `<p style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px 0">
        Tu biblioteca está vacía.<br><a href="tienda.html" style="color:var(--accent)">Visita la tienda</a></p>`;
    }

    await cargarAmigosPanel();

  } catch(e) {
    juegosGrid.innerHTML = "Error cargando biblioteca";
  }
}

function seleccionar(img) {
  document.querySelectorAll(".game-cover").forEach(i => i.classList.remove("game-selected"));
  img.classList.add("game-selected");
}

function mostrarJuego(juego, detalle) {
  detalle.innerHTML = `
    <div class="detalle-container">
      <img src="${CONFIG.API_BASE_URL}/uploads/${juego.imagen_url || 'img/default.png'}" class="detalle-img">
      <div class="detalle-info">
        <h1>${juego.titulo}</h1>
        <p class="detalle-desc">${juego.descripcion || "Sin descripción disponible"}</p>
        <p class="detalle-horas" id="detalle-horas">⏱️ Cargando horas...</p>
      </div>
    </div>

    <div class="detalle-dos-columnas">

      <div class="detalle-col-izq">
        <span class="steam-label">ACTUALIZACIONES</span>
        <div id="detalle-actualizaciones"><p style="color:var(--text-muted);font-size:12px">Cargando...</p></div>
      </div>

      <div class="detalle-col-der">
        <div class="steam-row">
          <span class="steam-label">LOGROS</span>
          <div id="detalle-logros" class="steam-logros-fila"></div>
        </div>
        <div class="steam-row">
          <span class="steam-label">AMIGOS</span>
          <div id="detalle-amigos" class="steam-amigos-fila"></div>
        </div>
      </div>

    </div>`;

  cargarDetalleJuego(juego.id);
}

async function cargarDetalleJuego(juegoId) {
  // Horas jugadas
  try {
    const res  = await fetch(`${CONFIG.API_BASE_URL}/juegos/${juegoId}/mis-horas`, { credentials: "include" });
    const data = await res.json();
    const el   = document.getElementById("detalle-horas");
    if (el) el.textContent = `⏱️ ${data.horas}h jugadas`;
  } catch(e) {}

  // Actualizaciones
  try {
    const res  = await fetch(`${CONFIG.API_BASE_URL}/juegos/${juegoId}/actualizaciones`);
    const acts = await res.json();
    const cont = document.getElementById("detalle-actualizaciones");
    if (!cont) return;
    if (!acts.length) {
      cont.innerHTML = `<p style="color:var(--text-muted);font-size:12px">Sin actualizaciones aún.</p>`;
    } else {
      cont.innerHTML = acts.map(a => `
        <div class="act-item">
          <div class="act-header">
            <span class="act-titulo">${a.titulo}</span>
            <span class="act-fecha">${a.fecha}</span>
          </div>
          ${a.descripcion ? `<p class="act-desc">${a.descripcion}</p>` : ""}
        </div>`).join("");
    }
  } catch(e) {}

  // Logros + estadísticas
  try {
    const [resLogros, resStats] = await Promise.all([
      fetch(`${CONFIG.API_BASE_URL}/juegos/${juegoId}/logros`, { credentials: "include" }),
      fetch(`${CONFIG.API_BASE_URL}/juegos/${juegoId}/logros-estadisticas`)
    ]);
    const logros = await resLogros.json();
    const stats  = await resStats.json();
    const statsMap = Object.fromEntries(stats.map(s => [s.id, s.porcentaje]));
    const cont   = document.getElementById("detalle-logros");
    if (!cont) return;
    if (!logros.length) {
      cont.innerHTML = `<span style="color:var(--text-muted);font-size:12px">Sin logros</span>`;
    } else {
      const desbloqueados = logros.filter(l => l.desbloqueado).length;
      cont.innerHTML = `
        <div class="steam-logros-iconos">
          ${logros.map(l => `
            <div class="steam-logro-icono ${l.desbloqueado ? '' : 'bloqueado'}" title="${l.nombre}: ${l.descripcion} (${statsMap[l.id] ?? 0}% jugadores)">
              <span>${l.icono}</span>
            </div>`).join("")}
        </div>
        <div class="steam-logros-barra-wrap">
          <div class="steam-logros-barra-bg">
            <div class="steam-logros-barra-fill" style="width:${logros.length ? Math.round(desbloqueados/logros.length*100) : 0}%"></div>
          </div>
          <span class="steam-logros-txt">${desbloqueados} / ${logros.length}</span>
        </div>`;
    }
  } catch(e) {}

  // Amigos con el juego
  try {
    const res    = await fetch(`${CONFIG.API_BASE_URL}/juegos/${juegoId}/amigos-con-juego`, { credentials: "include" });
    const amigos = await res.json();
    const cont   = document.getElementById("detalle-amigos");
    if (!cont) return;
    if (!amigos.length) {
      cont.innerHTML = `<span style="color:var(--text-muted);font-size:12px">Ningún amigo tiene este juego</span>`;
    } else {
      cont.innerHTML = amigos.map(a => `
        <div class="steam-amigo-avatar" title="${a.nombre} · ${a.horas}h">
          <img src="${CONFIG.API_BASE_URL}/uploads/${a.foto}" onerror="this.src='${CONFIG.API_BASE_URL}/uploads/avatars/default_avatar.png'">
        </div>`).join("");
    }
  } catch(e) {}
}

// ─────────────────────────────────────────
// PANEL AMIGOS
// ─────────────────────────────────────────
async function cargarAmigosPanel() {
  if (!usuario) return;
  const cont = document.getElementById("listaAmigosIndex");

  try {
    const res    = await fetch(`${CONFIG.API_BASE_URL}/usuarios/${usuario.id}/amigos`, { credentials: "include" });
    const amigos = await res.json();
    const aceptados = amigos.filter(a => a.estado === "aceptado");

    if (!aceptados.length) {
      cont.innerHTML = `<p class="amigos-vacio">Sin amigos aún.<br>
        <a href="perfil.html">Agrega desde tu perfil</a></p>`;
      return;
    }

    const online  = aceptados.filter(a => {
      const otro = a.usuario1.id === usuario.id ? a.usuario2 : a.usuario1;
      return ["online","ausente","ocupado"].includes((otro.estado||"offline").toLowerCase());
    });
    const offline = aceptados.filter(a => {
      const otro = a.usuario1.id === usuario.id ? a.usuario2 : a.usuario1;
      return !["online","ausente","ocupado"].includes((otro.estado||"offline").toLowerCase());
    });

    cont.innerHTML = "";

    if (online.length) {
      const tOnline = document.createElement("div");
      tOnline.className = "amigos-section-title";
      tOnline.textContent = `— Online (${online.length})`;
      cont.appendChild(tOnline);
      for (const a of online) await renderAmigoRow(a, cont);
    }
    if (offline.length) {
      const tOffline = document.createElement("div");
      tOffline.className = "amigos-section-title";
      tOffline.textContent = `— Offline (${offline.length})`;
      cont.appendChild(tOffline);
      for (const a of offline) await renderAmigoRow(a, cont);
    }

  } catch(e) {
    cont.innerHTML = `<p class="amigos-vacio">Error cargando amigos</p>`;
  }
}

async function renderAmigoRow(amigo, cont) {
  const otro   = amigo.usuario1.id === usuario.id ? amigo.usuario2 : amigo.usuario1;
  const estado = (otro.estado || "offline").toLowerCase();

  let noLeidos = 0;
  try {
    const r = await fetch(`${CONFIG.API_BASE_URL}/mensajes/no-leidos/${usuario.id}/de/${otro.id}`, { credentials: "include" });
    const data = await r.json(); noLeidos = data.total || 0;
  } catch(_) {}

  const estadoTxt = { online:"En línea", ausente:"Ausente", ocupado:"Ocupado", offline:"Desconectado" }[estado] || "Desconectado";

  const div = document.createElement("div");
  div.className = "amigo-row";
  div.innerHTML = `
    <div class="amigo-info">
      <span class="estado-dot ${estado}"></span>
      <div>
        <div class="amigo-nombre">
          ${otro.nombre}
          ${noLeidos > 0 ? `<span class="badge-msg">${noLeidos}</span>` : ""}
        </div>
        <div class="amigo-estado-txt">${estadoTxt}</div>
      </div>
    </div>
    <button class="btn-chat-mini" title="Abrir chat">💬</button>`;

  div.dataset.amigoId     = otro.id;
  div.dataset.amigoNombre = otro.nombre;
  cont.appendChild(div);
}

// ─────────────────────────────────────────
// CHAT FLOTANTE
// ─────────────────────────────────────────
// Listener delegado — un único handler en el contenedor para todos los amigos
document.getElementById("listaAmigosIndex").addEventListener("click", (e) => {
  const row = e.target.closest(".amigo-row");
  if (!row) return;
  abrirChatFlotante(parseInt(row.dataset.amigoId), row.dataset.amigoNombre);
});

async function abrirChatFlotante(amigoId, amigoNombre) {
  chatAmigoId = amigoId;
  document.getElementById("chatFloatNombre").textContent = "💬 " + amigoNombre;
  document.getElementById("chatFloat").classList.add("open");
  document.getElementById("chatFloatInput").focus();
  await cargarMensajesFloat();

  clearInterval(chatPollInterval);
  chatPollInterval = setInterval(cargarMensajesFloat, 3000);
}

document.getElementById("cerrarChatFloat").onclick = (e) => {
  e.stopPropagation();
  document.getElementById("chatFloat").classList.remove("open");
  clearInterval(chatPollInterval);
  chatAmigoId = null;
  cargarAmigosPanel(); // Refrescar badges
};

async function cargarMensajesFloat() {
  if (!chatAmigoId || !usuario) return;
  try {
    const res = await fetch(
      `${CONFIG.API_BASE_URL}/mensajes/conversacion?id1=${usuario.id}&id2=${chatAmigoId}`,
      { credentials: "include" }
    );
    const mensajes = await res.json();
    const cont = document.getElementById("chatFloatMessages");
    const abajo = cont.scrollHeight - cont.scrollTop <= cont.clientHeight + 60;

    cont.innerHTML = "";
    if (!mensajes.length) {
      cont.innerHTML = `<p style="text-align:center;color:var(--text-muted);font-size:12px;padding:20px 0">Sin mensajes aún. ¡Di hola!</p>`;
      return;
    }

    mensajes.forEach(m => {
      const esEnviado = m.emisor.id === usuario.id;
      const hora = new Date(m.fechaEnvio).toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" });
      const div = document.createElement("div");
      div.className = "msg " + (esEnviado ? "enviado" : "recibido");
      div.innerHTML = `${m.contenido}<span class="hora">${hora}</span>`;
      cont.appendChild(div);
    });

    if (abajo) cont.scrollTop = cont.scrollHeight;
  } catch(e) { console.error(e); }
}

document.getElementById("btnEnviarFloat").onclick = enviarMensajeFloat;
document.getElementById("chatFloatInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviarMensajeFloat(); }
});

async function enviarMensajeFloat() {
  const input    = document.getElementById("chatFloatInput");
  const contenido = input.value.trim();
  if (!contenido || !chatAmigoId || !usuario) return;

  input.value = "";
  try {
    await fetch(`${CONFIG.API_BASE_URL}/mensajes`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ emisorId: usuario.id, receptorId: chatAmigoId, contenido })
    });
    await cargarMensajesFloat();
  } catch(e) {
    console.error(e);
    input.value = contenido;
  }
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
document.addEventListener("DOMContentLoaded", async () => {
  await actualizarBiblioteca();
  // Refrescar panel amigos cada 20s
  amigosPollInterval = setInterval(cargarAmigosPanel, 20000);
});
</script>

</body>
</html>
