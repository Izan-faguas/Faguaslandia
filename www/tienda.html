<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - Faguáslandia</title>
  <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/svg+xml" href="faguaslandia_logo.svg">
</head>

<body>

<header>
  <nav class="menu">
        <a href="index.html">Biblioteca</a>
        <a href="tienda.html">Tienda</a>
        <a href="perfil.html">Perfil</a>
        <a href="registro.html">Registro</a>
        <a href="login.html">Iniciar sesión</a>
    </nav>
    <script type="module">
        import { getSessionUser, logout } from "./session.js";

        const menu = document.querySelector(".menu");

        const usuario = await getSessionUser();

        if (usuario) {

            menu.innerHTML = `
                <a href="index.html">Biblioteca</a>
                <a href="tienda.html">Tienda</a>
                <a href="perfil.html">Perfil</a>
                <a href="#" id="logoutBtn">Cerrar sesión</a>
            `;

            document.getElementById("logoutBtn").onclick = logout;

        } else {

            menu.innerHTML = `
                <a href="index.html">Biblioteca</a>
                <a href="tienda.html">Tienda</a>
                <a href="registro.html">Registro</a>
                <a href="login.html">Iniciar sesión</a>
            `;
        }
    </script>
</header>

<main class="tienda">
  <div class="buscador">

    <input type="text" id="busqueda" placeholder="Buscar juego...">

    <select id="filtroCategoria">
      <option value="">Todas las categorías</option>
    </select>

    <select id="filtroPrecio">
      <option value="">Cualquier precio</option>
      <option value="gratis">Gratis</option>
      <option value="0-10">0€ - 10€</option>
      <option value="10-30">10€ - 30€</option>
      <option value="30+">30€+</option>
    </select>

  </div>
  <section id="listaJuegos" class="juegos-grid"></section>

</main>

<script type="module">
  import CONFIG from "./config.js";
  import { getSessionUser } from "./session.js";

  function imgUrl(imagen_url, variante) {
    if (!imagen_url) return `${CONFIG.API_BASE_URL}/uploads/img/default.png`;
    const base = `${CONFIG.API_BASE_URL}/uploads/${imagen_url.replace(/\.png$/i, '')}`;
    if (!variante) return `${CONFIG.API_BASE_URL}/uploads/${imagen_url}`;
    return `${base}${variante}.png`;
  }

  const listaJuegosDiv = document.getElementById("listaJuegos");

  const inputBusqueda   = document.getElementById("busqueda");
  const filtroCategoria = document.getElementById("filtroCategoria");
  const filtroPrecio    = document.getElementById("filtroPrecio");

  let juegosGlobal  = [];
  let compradosSet  = new Set(); 

  async function cargarJuegos() {
    try {
      const response = await fetch(`${CONFIG.API_BASE_URL}/juegos`);
      if (!response.ok) throw new Error("No se pudieron cargar los juegos");

      juegosGlobal = await response.json();

      const usuario = await getSessionUser();
      if (usuario) {
        try {
          const resCompras = await fetch(
            `${CONFIG.API_BASE_URL}/compras/usuario/${usuario.id}`,
            { credentials: "include" }
          );
          if (resCompras.ok) {
            const compras = await resCompras.json();
            compradosSet = new Set(compras.map(c => c.id));
          }
        } catch(_) {}
      }

      cargarCategorias(juegosGlobal);
      mostrarJuegos(juegosGlobal);

    } catch (error) {
      listaJuegosDiv.textContent = error.message;
    }
  }

  function cargarCategorias(juegos) {
    const categorias = [...new Set(juegos.map(j => j.categoria))];

    categorias.forEach(cat => {
      const option = document.createElement("option");
      option.value = cat;
      option.textContent = cat;
      filtroCategoria.appendChild(option);
    });
  }

function mostrarJuegos(juegos) {
    listaJuegosDiv.innerHTML = "";

    juegos.forEach(juego => {
        const comprado = compradosSet.has(juego.id);
        const precioTxt = comprado ? "En tu biblioteca"
            : (juego.precio ? juego.precio + "€" : "Gratis");

        const estrellas = juego.valoracion_promedio
            ? "★".repeat(Math.round(juego.valoracion_promedio)) +
              "☆".repeat(5 - Math.round(juego.valoracion_promedio))
            : "";

        const juegoSection = document.createElement("section");
        juegoSection.className = "hero juego";
        juegoSection.innerHTML = `
            <div class="hero-media">
                <img src="${imgUrl(juego.imagen_url, '920')}"
                     onerror="this.onerror=null;this.src='${imgUrl(juego.imagen_url, null)}'">
                ${comprado ? '<span class="badge-comprado">En tu biblioteca</span>' : ""}
            </div>
            <div class="hero-info">
                <div>
                    <h2>${juego.titulo}</h2>
                    <div class="hero-tags" style="margin: 6px 0 8px">
                        ${juego.categoria ? `<span class="hero-tag">${juego.categoria}</span>` : ""}
                        ${juego.desarrollador ? `<span class="hero-tag dev">${juego.desarrollador}</span>` : ""}
                    </div>
                    <p>${juego.descripcion ?? "Sin descripción"}</p>
                </div>
                <div class="hero-footer">
                    <span class="price ${comprado ? 'comprado' : ''}">${precioTxt}</span>
                    ${estrellas ? `<span class="hero-rating">${estrellas} ${juego.valoracion_promedio}</span>` : ""}
                </div>
            </div>`;

        juegoSection.onclick = () => window.location.href = `juego.html?id=${juego.id}`;
        listaJuegosDiv.appendChild(juegoSection);
    });
}

  function filtrar() {
    const texto = inputBusqueda.value.toLowerCase();
    const categoria = filtroCategoria.value;
    const precio = filtroPrecio.value;

    let filtrados = juegosGlobal.filter(juego => {

      const coincideTexto =
        juego.titulo.toLowerCase().includes(texto) ||
        juego.descripcion.toLowerCase().includes(texto);

      const coincideCategoria =
        !categoria || juego.categoria === categoria;

      let coincidePrecio = true;

      if (precio === "gratis") {
        coincidePrecio = !juego.precio;
      } else if (precio === "0-10") {
        coincidePrecio = juego.precio <= 10;
      } else if (precio === "10-30") {
        coincidePrecio = juego.precio > 10 && juego.precio <= 30;
      } else if (precio === "30+") {
        coincidePrecio = juego.precio > 30;
      }

      return coincideTexto && coincideCategoria && coincidePrecio;
    });

    mostrarJuegos(filtrados);
  }

  inputBusqueda.addEventListener("input", filtrar);
  filtroCategoria.addEventListener("change", filtrar);
  filtroPrecio.addEventListener("change", filtrar);

  document.addEventListener("DOMContentLoaded", cargarJuegos);
</script>

</body>
</html>
