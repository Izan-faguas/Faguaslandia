<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="image/svg+xml" href="faguaslandia_logo.svg">

</head>

<body>

<header>
  <nav class="menu"></nav>
  <script type="module">
    import { getSessionUser, logout } from "./session.js";
    const menu = document.querySelector(".menu");
    const usuario = await getSessionUser();
    if (usuario) {
      menu.innerHTML = `
        <a href="index.html">Biblioteca</a>
        <a href="tienda.html">Tienda</a>
        <a href="perfil.html">Perfil</a>
        <a href="#" id="logoutBtn">Cerrar sesión</a>
      `;
      document.getElementById("logoutBtn").onclick = logout;
    } else {
      menu.innerHTML = `
        <a href="index.html">Biblioteca</a>
        <a href="tienda.html">Tienda</a>
        <a href="registro.html">Registro</a>
        <a href="login.html">Iniciar sesión</a>
      `;
    }
  </script>
</header>

<main id="juegoContainer"></main>

<script type="module">
import CONFIG from "./config.js";
import { getSessionUser } from "./session.js";

function imgUrl(imagen_url, variante) {
  if (!imagen_url) return `${CONFIG.API_BASE_URL}/uploads/img/default.png`;
  const base = `${CONFIG.API_BASE_URL}/uploads/${imagen_url.replace(/\.png$/i, '')}`;
  if (!variante) return `${CONFIG.API_BASE_URL}/uploads/${imagen_url}`;
  return `${base}${variante}.png`;
}

const container = document.getElementById("juegoContainer");
const params    = new URLSearchParams(window.location.search);
const juegoId   = params.get("id");

if (!juegoId) {
  container.innerHTML = "Juego no encontrado";
}

let puntuacionSeleccionada = 0;

async function cargarJuego() {
  try {
    const res = await fetch(`${CONFIG.API_BASE_URL}/juegos/${juegoId}`);
    if (!res.ok) throw new Error();
    const juego = await res.json();

    let comprado = false;
    try {
      const usuario = await getSessionUser();
      if (usuario) {
        const resCompra = await fetch(
          `${CONFIG.API_BASE_URL}/compras/usuario/${usuario.id}/juego/${juegoId}`,
          { credentials: "include" }
        );
        if (resCompra.ok) comprado = await resCompra.json();
      }
    } catch (e) {}

    container.innerHTML = `
      <div class="game-page">

        <div class="game-hero">
          <img src="${imgUrl(juego.imagen_url, '1232')}" onerror="this.onerror=null;this.src='${imgUrl(juego.imagen_url, null)}'">
          <div class="game-overlay"></div>
          <h1>${juego.titulo}</h1>
        </div>

        <div class="game-content">
          <div class="game-left">
            <img src="${imgUrl(juego.imagen_url, '920')}" onerror="this.onerror=null;this.src='${imgUrl(juego.imagen_url, null)}'" class="game-main-img">
          </div>
          <div class="game-right">
            <div class="game-card">
              <h2>Sobre el juego</h2>
              <p class="game-desc">${juego.descripcion ?? 'Sin descripción'}</p>
            </div>
            <div class="game-card">
              <h3 class="price">${juego.precio ? juego.precio + "€" : "Gratis"}</h3>
              <button id="comprarBtn" ${comprado ? "disabled" : ""}>
                ${comprado ? "Comprado" : "Comprar"}
              </button>
            </div>
            <div class="game-card info">
              <p><strong>Categoría:</strong> ${juego.categoria ?? "No definida"}</p>
              <p><strong>Desarrollador:</strong> ${juego.desarrollador ?? "Desconocido"}</p>
              <p><strong>Fecha:</strong> ${juego.fecha_lanzamiento ?? "???"}</p>
              <p><strong>Valoración:</strong> <span id="valoracionMedia">${juego.valoracion_promedio ?? "0"}</span></p>
            </div>
          </div>
        </div>

        <!-- RESEÑAS -->
        <div class="game-resenas">
          <h2>Reseñas</h2>

          <div class="resena-form" id="resenaForm" style="display:none">
            <h3 id="resenaFormTitulo">Escribe tu reseña</h3>
            <div class="estrellas-input">
              <span class="estrella" data-v="1">★</span>
              <span class="estrella" data-v="2">★</span>
              <span class="estrella" data-v="3">★</span>
              <span class="estrella" data-v="4">★</span>
              <span class="estrella" data-v="5">★</span>
            </div>
            <textarea id="comentarioInput" placeholder="Cuéntanos qué te pareció..." maxlength="1000" rows="4"></textarea>
            <div style="display:flex;gap:10px;margin-top:8px">
              <button id="btnGuardarResena">Guardar reseña</button>
              <button id="btnEliminarResena" style="display:none;background:var(--danger,#e74c3c)">Eliminar reseña</button>
            </div>
          </div>

          <div id="mensajeResena" style="display:none"></div>
          <div id="listaResenas"><p style="color:var(--text-muted)">Cargando reseñas...</p></div>
        </div>

      </div>
    `;

    const btn = document.getElementById("comprarBtn");
    if (comprado) {
      btn.style.opacity = "0.5";
      btn.style.cursor  = "not-allowed";
    } else {
      btn.onclick = comprar;
    }

    await cargarResenas(comprado);

  } catch (e) {
    container.innerHTML = "Error cargando juego";
  }
}


async function comprar() {
  try {
    const res = await fetch(`${CONFIG.API_BASE_URL}/compras`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ juegoId })
    });
    if (res.status === 401) { alert("Tienes que iniciar sesión"); return; }
    if (!res.ok) throw new Error();
    alert("Juego comprado");
    location.reload();
  } catch {
    alert("Error al comprar");
  }
}

async function cargarResenas(comprado) {
  const usuario = await getSessionUser();

  if (!usuario) {
    mostrarMensajeResena('<a href="login.html">Inicia sesión</a> para dejar una reseña.');
  } else if (!comprado) {
    mostrarMensajeResena("Compra el juego para poder dejar una reseña.");
  } else {
    const form = document.getElementById("resenaForm");
    form.style.display = "block";

    try {
      const r = await fetch(`${CONFIG.API_BASE_URL}/resenas/juego/${juegoId}/mia`, { credentials: "include" });
      if (r.ok) {
        const mia = await r.json();
        seleccionarEstrella(mia.puntuacion);
        document.getElementById("comentarioInput").value = mia.comentario ?? "";
        document.getElementById("resenaFormTitulo").textContent = "Tu reseña";
        document.getElementById("btnEliminarResena").style.display = "inline-block";
      }
    } catch(_) {}

    document.querySelectorAll(".estrella").forEach(el => {
      el.onclick = () => seleccionarEstrella(parseInt(el.dataset.v));
    });

    document.getElementById("btnGuardarResena").onclick = async () => {
      if (!puntuacionSeleccionada) { alert("Selecciona una puntuación"); return; }
      const comentario = document.getElementById("comentarioInput").value.trim();
      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/resenas/juego/${juegoId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ puntuacion: puntuacionSeleccionada, comentario })
        });
        if (!res.ok) throw new Error();
        document.getElementById("resenaFormTitulo").textContent = "Tu reseña";
        document.getElementById("btnEliminarResena").style.display = "inline-block";
        await renderListaResenas();
        await actualizarMedia();
      } catch(e) { alert("Error guardando reseña"); }
    };

    document.getElementById("btnEliminarResena").onclick = async () => {
      if (!confirm("¿Eliminar tu reseña?")) return;
      await fetch(`${CONFIG.API_BASE_URL}/resenas/juego/${juegoId}`, { method: "DELETE", credentials: "include" });
      puntuacionSeleccionada = 0;
      seleccionarEstrella(0);
      document.getElementById("comentarioInput").value = "";
      document.getElementById("btnEliminarResena").style.display = "none";
      document.getElementById("resenaFormTitulo").textContent = "Escribe tu reseña";
      await renderListaResenas();
      await actualizarMedia();
    };
  }

  await renderListaResenas();
}

function mostrarMensajeResena(html) {
  const el = document.getElementById("mensajeResena");
  if (!el) return;
  el.style.display = "block";
  el.style.cssText += ";padding:12px;color:var(--text-muted);font-size:14px;margin-bottom:16px";
  el.innerHTML = html;
}

function seleccionarEstrella(v) {
  puntuacionSeleccionada = v;
  document.querySelectorAll(".estrella").forEach(el => {
    el.classList.toggle("activa", parseInt(el.dataset.v) <= v);
  });
}

async function renderListaResenas() {
  const cont = document.getElementById("listaResenas");
  if (!cont) return;
  try {
    const res    = await fetch(`${CONFIG.API_BASE_URL}/resenas/juego/${juegoId}`);
    const resenas = await res.json();

    if (!resenas.length) {
      cont.innerHTML = `<p style="color:var(--text-muted);margin-top:12px">Sin reseñas aún. ¡Sé el primero!</p>`;
      return;
    }

    cont.innerHTML = resenas.map(r => {
      const estrellas = "★".repeat(r.puntuacion) + "☆".repeat(5 - r.puntuacion);
      const fecha     = new Date(r.fecha).toLocaleDateString("es-ES");
      return `
        <div class="resena-item">
          <div class="resena-header">
            <strong>${r.usuario.nombre}</strong>
            <span class="resena-estrellas">${estrellas}</span>
            <span class="resena-fecha">${fecha}</span>
          </div>
          ${r.comentario ? `<p class="resena-comentario">${r.comentario}</p>` : ""}
        </div>`;
    }).join("");
  } catch(e) {
    cont.innerHTML = `<p style="color:var(--text-muted)">Error cargando reseñas</p>`;
  }
}

async function actualizarMedia() {
  const res   = await fetch(`${CONFIG.API_BASE_URL}/juegos/${juegoId}`);
  const juego = await res.json();
  const el    = document.getElementById("valoracionMedia");
  if (el) el.textContent = juego.valoracion_promedio ?? "0";
}

document.addEventListener("DOMContentLoaded", cargarJuego);
</script>

</body>
</html>
